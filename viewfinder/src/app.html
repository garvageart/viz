<!doctype html>
<html lang="en" %THEME_ATTR% class="antialiasing">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>viz</title>

        <style id="splash-styles">
            html,
            body {
                height: 100%;
                margin: 0;
            }

            #app-splash {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--viz-100, #0c0f17);
                background-image:
                    linear-gradient(
                        to right,
                        color-mix(in srgb, var(--viz-60, rgba(255, 255, 255, 0.1)) 8%, transparent) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        to bottom,
                        color-mix(in srgb, var(--viz-60, rgba(255, 255, 255, 0.1)) 8%, transparent) 1px,
                        transparent 1px
                    );
                background-size: 40px 40px;
                background-position: center;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9999;
                transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            }

            #app-splash .splash-inner {
                text-align: center;
                animation: splash-fade-in 0.4s ease-out forwards;
            }

            #app-splash .splash-text {
                font-family: "Roboto Mono Variable", "Roboto Mono", monospace;
                font-size: 2.8rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                color: var(--viz-text-color, #f8fafc);
                margin: 0;
                text-transform: lowercase;
                display: inline-flex;
                align-items: center;
            }

            #app-splash .splash-text::after {
                content: "_";
                color: var(--viz-primary, #3b82f6);
                animation: splash-cursor-blink 0.8s step-end infinite;
                margin-left: 2px;
            }

            @keyframes splash-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes splash-cursor-blink {
                from,
                to {
                    color: transparent;
                }
                50% {
                    color: var(--viz-primary, #3b82f6);
                }
            }

            .app-splash--fade {
                opacity: 0;
                pointer-events: none;
            }
        </style>

        <script id="theme-ready-script">
            (function () {
                try {
                    const storedTheme = localStorage.getItem("viz:theme");
                    const osTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

                    let theme = osTheme;

                    if (storedTheme === "light" || storedTheme === "dark") {
                        theme = storedTheme;
                    }

                    document.documentElement.setAttribute("data-theme", theme);
                } catch (e) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
        <link rel="preload" as="font" type="font/woff2" href="%viz.css.display_font%" crossorigin="anonymous" />
        <link rel="preload" as="font" type="font/woff2" href="%viz.css.mono_font%" crossorigin="anonymous" />

        %viz.css.theme_style% %sveltekit.head%
    </head>

    <body>
        <div id="app-splash" aria-hidden="true">
            <div class="splash-inner">
                <h1 class="splash-text">viz</h1>
            </div>
        </div>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
