<!doctype html>
<html lang="en" %THEME_ATTR% class="antialiasing">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="viz" />
        <title>viz</title>

        <style id="splash-styles">
            html,
            body {
                height: 100%;
                margin: 0;
                background-color: var(--viz-bg-color);
            }

            #app-splash {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--viz-bg-color);
                background-image:
                    linear-gradient(to right, color-mix(in srgb, var(--viz-60) 8%, transparent) 1px, transparent 1px),
                    linear-gradient(to bottom, color-mix(in srgb, var(--viz-60) 8%, transparent) 1px, transparent 1px);
                background-size: 40px 40px;
                background-position: center;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9999;
                transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            }

            #app-splash .splash-inner {
                text-align: center;
                animation: splash-fade-in 0.4s ease-out forwards;
            }

            #app-splash .splash-viewfinder {
                position: relative;
                padding: 1rem 2rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            #app-splash .corner {
                position: absolute;
                width: 8px;
                height: 8px;
                border-color: var(--viz-primary);
                border-style: solid;
                opacity: 0.85;
            }

            #app-splash .corner.top-left {
                top: 0;
                left: 0;
                border-width: 1.5px 0 0 1.5px;
            }

            #app-splash .corner.top-right {
                top: 0;
                right: 0;
                border-width: 1.5px 1.5px 0 0;
            }

            #app-splash .corner.bottom-left {
                bottom: 0;
                left: 0;
                border-width: 0 0 1.5px 1.5px;
            }

            #app-splash .corner.bottom-right {
                bottom: 0;
                right: 0;
                border-width: 0 1.5px 1.5px 0;
            }

            #app-splash .splash-loader {
                width: 52px;
                height: 3px;
                background-color: color-mix(in srgb, var(--viz-text-color) 15%, transparent);
                margin: 1.25rem auto 0;
                position: relative;
                overflow: hidden;
                border-radius: 3px;
            }

            #app-splash .splash-loader::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                width: 40%;
                background-color: var(--viz-primary);
                border-radius: 3px;
                animation: splash-slide 1s ease-in-out infinite;
            }

            @keyframes splash-slide {
                0% {
                    left: -40%;
                }

                100% {
                    left: 100%;
                }
            }

            #app-splash .splash-text {
                font-family: "Roboto Mono Variable", "Roboto Mono", monospace;
                font-size: 3rem;
                font-weight: 700;
                color: var(--viz-text-color);
                margin: 0;
                text-transform: lowercase;
                display: inline-flex;
                align-items: center;
            }

            @keyframes splash-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .app-splash--fade {
                opacity: 0;
                pointer-events: none;
            }
        </style>

        <script id="theme-ready-script">
            (function () {
                try {
                    const storedTheme = localStorage.getItem("viz:theme");
                    const osTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

                    let theme = osTheme;

                    if (storedTheme === "light" || storedTheme === "dark") {
                        theme = storedTheme;
                    }

                    document.documentElement.setAttribute("data-theme", theme);
                } catch (e) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
        <link rel="preload" as="font" type="font/woff2" href="%viz.css.display_font%" crossorigin="anonymous" />
        <link rel="preload" as="font" type="font/woff2" href="%viz.css.mono_font%" crossorigin="anonymous" />

        %viz.css.theme_style% %sveltekit.head%
    </head>

    <body>
        <div id="app-splash" aria-hidden="true">
            <div class="splash-inner">
                <div class="splash-viewfinder">
                    <span class="corner top-left"></span>
                    <span class="corner top-right"></span>
                    <span class="corner bottom-left"></span>
                    <span class="corner bottom-right"></span>
                    <h1 class="splash-text">viz</h1>
                </div>
                <div class="splash-loader"></div>
            </div>
        </div>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
