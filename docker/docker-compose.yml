services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "7770:7770"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - viz-data:/app/var
    networks:
      - viz-net

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-viz}
    volumes:
      - viz-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-viz}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viz-net

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - viz-net

networks:
  viz-net:
    driver: bridge

volumes:
  viz-db-data:
  viz-data:
