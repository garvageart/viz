# Production deployment template for self-hosted instances.
#
# Compose-level variables:
#   REPO_HOST          - container registry host (e.g. git.example.com)
#   REPOSITORY         - owner/repo holding the viz-server image (e.g. you/viz)
#   DATABASE_LOCATION  - host path for the PostgreSQL data directory
#   IMAGE_TAG          - viz-server image tag to deploy (default: latest)
#
# Server environment variables (DB_USER, DB_PASSWORD, DB_NAME, ENV, API_PORT, ...)
# are read from the root .env file and documented in docs/setup/ENVIRONMENT_VARIABLES.md.

name: viz
networks:
  default:
    name: viz_default

volumes:
  data:

services:
  server:
    image: ${REPO_HOST:?}/${REPOSITORY:?}/viz-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - ENV=production
      - API_HOST=0.0.0.0
    volumes:
      - data:/app/data
      - ../viz.json:/app/viz.json
    ports:
      - 7780:7770
    networks:
      - default

  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: db
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-viz}
    volumes:
      - ${DATABASE_LOCATION:?}:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-viz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
