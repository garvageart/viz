# Executes the centralized Forgejo/GitHub Actions workflow (.forgejo/workflows/viz.yml) using the 'act' engine
stages:
    - test

run_workflow:
    stage: test
    image: docker:27-cli
    services:
        - docker:27-dind
    variables:
        DOCKER_HOST: tcp://docker:2375
    before_script:
        - apk add --no-cache curl bash git
        - curl -fsSL https://raw.githubusercontent.com/nektos/act/master/install.sh | sh
    script:
        - ./bin/act -W .forgejo/workflows/viz.yml --secret GITHUB_TOKEN=$CI_JOB_TOKEN
